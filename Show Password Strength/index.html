<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Password Strength</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <div class="h-screen w-full bg-[#201f21] flex items-center justify-center">
        <div class="w-100 max-w-[90%] relative">
            <input type="password" id="password" class="w-full h-15 px-5 border border-[#ccc] border-solid text-white bg-transparent" placeholder="Password">
            <button type="submit" class="bg-transparent border-0 rounded-full cursor-pointer absolute top-1/2 -translate-y-1/2 right-4"><img src="images/arrow.png" width="35px" alt=""></button>
            <p id ="msg" class="hidden absolute -bottom-7.5 text-white text-[15px] placeholder:text-[15px]">Password is <span id="strength"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
