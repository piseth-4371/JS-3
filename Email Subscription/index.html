<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Subscription</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <div class="w-full h-screen bg-gray-600 py-2.5 px-[10%] text-white">
        <h3 class="mt-[15%] font-bold text-[30px] text-[#61b752]">Coming Sonn!</h3>
        <h1 class="mt-7 text-[50px] font-bold">OurBand New <br>Website IS On It's Way</h1>
        <p class="mb-5 text-lg font-medium">Subscribe for more details</p>
        <form action="" class="bg-white flex w-fit my-10" name="submnit-to-google-sheet">
            <input type="email"  name="Email" class="py-2.5 px-5 h-17 w-100 text-[18px] text-gray-600" placeholder="Enter your email">
            <button type="submit" class="bg-[#61b752] h-17 w-25 cursor-pointer flex items-center justify-center"><img src="images/send-icon.png" alt="" width="30px"></button>
        </form>
        <span class="text-[#61b752] mt-2" id="msg"></span>
    </div>
    <script src="script.js"></script>
    <!-- https://github.com/jamiewilson/form-to-google-sheets/ -->
</body>
</html>
